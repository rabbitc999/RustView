mily="&#39;Microsoft YaHei&#39;, &#39;Segoe UI&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="10" fill="#55677f" text-anchor="end">只解释标注，不做合法性校验</text><rect x="48" y="126" width="350" height="196" rx="8" fill="#fbfcfe" stroke="#d8e1ee" stroke-width="1.6"/><line x1="54" y1="172" x2="392" y2="172" stroke="#d8e1ee" stroke-width="1"/><text x="58" y="159" font-family="&#39;Microsoft YaHei&#39;, &#39;Segoe UI&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="12" fill="#14507e" font-weight="700">fn main（第 19 行）</text><rect x="52" y="185" width="346" height="38" rx="7" fill="#ffffff" stroke="#c9dcf0" stroke-width="1"/><text x="64" y="202" font-family="&#39;Microsoft YaHei&#39;, &#39;Segoe UI&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="13" fill="#22364f" font-weight="700">s</text><text x="64" y="217" font-family="&#39;Microsoft YaHei&#39;, &#39;Segoe UI&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="11" fill="#22364f">String · Initialized</text><rect x="52" y="233" width="346" height="38" rx="7" fill="#f2ecff" stroke="#9b7be8" stroke-width="1"/><text x="64" y="250" font-family="&#39;Microsoft YaHei&#39;, &#39;Segoe UI&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="13" fill="#22364f" font-weight="700">r</text><text x="64" y="265" font-family="&#39;Microsoft YaHei&#39;, &#39;Segoe UI&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="11" fill="#22364f">&amp;'a String · Initialized</text><rect x="52" y="281" width="346" height="38" rx="7" fill="#f2ecff" stroke="#9b7be8" stroke-width="1"/><text x="64" y="298" font-family="&#39;Microsoft YaHei&#39;, &#39;Segoe UI&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="13" fill="#22364f" font-weight="700">m</text><text x="64" y="313" font-family="&#39;Microsoft YaHei&#39;, &#39;Segoe UI&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="11" fill="#22364f">&amp;'a String · Initialized</text><rect x="862" y="137" width="406" height="38" rx="7" fill="#eaf6ef" stroke="#bfe0cc" stroke-width="1"/><text x="874" y="154" font-family="&#39;Microsoft YaHei&#39;, &#39;Segoe UI&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="13" fill="#1e6b46" font-weight="700">String &quot;hello&quot;</text><text x="874" y="169" font-family="&#39;Microsoft YaHei&#39;, &#39;Segoe UI&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="11" fill="#3f6c53">所有者：s（第 20 行创建）</text><path d="M 398 204 C 550 204, 550 156, 862 156" fill="none" stroke="#9bb8d4" stroke-width="1.6"/><path d="M 398 252 C 450 252, 450 204, 398 204" fill="none" stroke="#b9c6d6" stroke-width="1.6" stroke-dasharray="3 4"/><path d="M 398 300 C 459 300, 459 204, 398 204" fill="none" stroke="#b9c6d6" stroke-width="1.6" stroke-dasharray="3 4"/><rect x="482" y="136" width="316" height="66" rx="7" fill="#eaf7f8" stroke="#5fabae" stroke-width="1.2"/><text x="494" y="152" font-family="&#39;Microsoft YaHei&#39;, &#39;Segoe UI&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="13" fill="#146b6e" font-weight="700">first()</text><text x="494" y="167" font-family="&#39;Microsoft YaHei&#39;, &#39;Segoe UI&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="9.5" fill="#55677f">first&lt;'a&gt;(&amp;'a String) -&gt; &amp;'a String</text><text x="494" y="182" font-family="&#39;Microsoft YaHei&#39;, &#39;Segoe UI&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="10" fill="#55677f">实参：&amp;s</text><text x="494" y="196" font-family="&#39;Microsoft YaHei&#39;, &#39;Segoe UI&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="9.5" fill="#146b6e">返回的 'a 绑定到第 1 个实参 `&amp;s` 上</text><rect x="482" y="232" width="316" height="66" rx="7" fill="#eaf7f8" stroke="#5fabae" stroke-width="1.2"/><text x="494" y="248" font-family="&#39;Microsoft YaHei&#39;, &#39;Segoe UI&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="13" fill="#146b6e" font-weight="700">longer()</text><text x="494" y="263" font-family="&#39;Microsoft YaHei&#39;, &#39;Segoe UI&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="9.5" fill="#55677f">longer&lt;'a, 'b: 'a&gt;(&amp;'a String, &amp;'b String) -&gt; &amp;'a String</text><text x="494" y="278" font-family="&#39;Microsoft YaHei&#39;, &#39;Segoe UI&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="10" fill="#55677f">实参：&amp;s, &amp;s</text><text x="494" y="292" font-family="&#39;Microsoft YaHei&#39;, &#39;Segoe UI&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="9.5" fill="#146b6e">返回的 'a 绑定到第 1 个实参 `&amp;s` 上</text><rect x="1332" y="137" width="416" height="38" rx="7" fill="#eaf7f8" stroke="#5fabae" stroke-width="1.2"/><text x="1344" y="154" font-family="&#39;Microsoft YaHei&#39;, &#39;Segoe UI&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="13" fill="#146b6e" font-weight="700">fn first&lt;'a&gt;</text><text x="1344" y="169" font-family="&#39;Microsoft YaHei&#39;, &#39;Segoe UI&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="10" fill="#55677f">声明的生命周期参数：引用可以活多久，由调用方决定</text><rect x="1332" y="185" width="416" height="38" rx="7" fill="#eaf7f8" stroke="#5fabae" stroke-width="1.2"/><text x="1344" y="202" font-family="&#39;Microsoft YaHei&#39;, &#39;Segoe UI&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="13" fill="#146b6e" font-weight="700">fn longer&lt;'a, 'b: 'a&gt;</text><text x="1344" y="217" font-family="&#39;Microsoft YaHei&#39;, &#39;Segoe UI&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="10" fill="#55677f">声明的生命周期参数：引用可以活多久，由调用方决定</text><line x1="1332" y1="234" x2="1748" y2="234" stroke="#d8e1ee" stroke-width="1"/><text x="1334" y="256" font-family="&#39;Microsoft YaHei&#39;, &#39;Segoe UI&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="11" fill="#14507e" font-weight="700">调用点：'a 绑定到谁</text><rect x="1332" y="281" width="416" height="38" rx="7" fill="#eaf7f8" stroke="#5fabae" stroke-width="1"/><text x="1344" y="297" font-family="&#39;Microsoft YaHei&#39;, &#39;Segoe UI&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="11.5" fill="#146b6e" font-weight="700">fn first&lt;'a&gt;()</text><text x="1344" y="312" font-family="&#39;Microsoft YaHei&#39;, &#39;Segoe UI&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="10" fill="#146b6e">第 23 行：返回的 'a 绑定到第 1 个实参 `&amp;s` 上</text><rect x="1332" y="329" width="416" height="38" rx="7" fill="#eaf7f8" stroke="#5fabae" stroke-width="1"/><text x="1344" y="345" font-family="&#39;Microsoft YaHei&#39;, &#39;Segoe UI&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="11.5" fill="#146b6e" font-weight="700">fn longer&lt;'a, 'b: 'a&gt;()</text><text x="1344" y="360" font-family="&#39;Microsoft YaHei&#39;, &#39;Segoe UI&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="10" fill="#146b6e">第 26 行：返回的 'a 绑定到第 1 个实参 `&amp;s` 上</text><text x="40" y="424" font-family="&#39;Microsoft YaHei&#39;, &#39;Segoe UI&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="12" fill="#1e6b46">本示例没有借用冲突：值语义各自独立，Move 之后原变量已失效，借用关系合法。（快照点：入口函数 main 返回之前；内层块退出后其变量标灰为「已销毁」）</text><text x="40" y="446" font-family="&#39;Microsoft YaHei&#39;, &#39;Segoe UI&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="11" fill="#146b6e">生命周期标注：`fn f&lt;'a&gt;(s: &amp;'a String) -&gt; &amp;'a String` 读作「返回的引用和 s 活得一样久」；第四栏列出声明的 'a 在每次调用里绑定到哪个实参。本工具只画标注，不校验它是否成立。</text><text x="1720" y="461" font-family="&#39;Microsoft YaHei&#39;, &#39;Segoe UI&#39;, &#39;Noto Sans SC&#39;, sans-serif" font-size="10" fill="#55677f" text-anchor="end">RustView 1.1 · 生命周期标注只画不校验（1.0 版面契约保持不变）</text></svg>
